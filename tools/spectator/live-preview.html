<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BulletBallet — live camera preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070a;
        color: #c8f542;
        font: 13px/1.5 ui-monospace, monospace;
        overflow: hidden;
      }
      #wrap {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }
      canvas {
        width: 100vw;
        height: auto;
        image-rendering: pixelated;
        background: #000;
      }
      #hud {
        position: absolute;
        left: 12px;
        bottom: 12px;
        background: rgba(0, 0, 0, 0.6);
        padding: 8px 12px;
        border: 1px solid rgba(200, 245, 66, 0.3);
        white-space: pre;
      }
      #state.off {
        color: #ff6b6b;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="c" width="480" height="270"></canvas>
      <div id="hud">connecting…</div>
    </div>
    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const hud = document.getElementById('hud');
      let frames = 0;
      let bytes = 0;
      let last = performance.now();
      let rate = 0;

      function connect() {
        const ws = new WebSocket('ws://127.0.0.1:5180/view');
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
          hud.classList.remove('off');
          hud.textContent = 'connected — waiting for frames';
        };
        ws.onmessage = async (ev) => {
          const buf = ev.data;
          const now = performance.now();
          if (now - last > 1000) {
            rate = frames;
            frames = 0;
            last = now;
            hud.textContent =
              `${rate} fps  ${(bytes / 1024 / 1024).toFixed(1)}MB total  ` +
              `last frame ${(buf.byteLength / 1024).toFixed(1)}KB`;
            bytes = 0;
          }
          frames += 1;
          bytes += buf.byteLength;
          const bmp = await createImageBitmap(new Blob([buf], { type: 'image/jpeg' }));
          ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
          bmp.close();
        };
        ws.onclose = () => {
          hud.classList.add('off');
          hud.textContent = 'disconnected — retrying in 2s';
          setTimeout(connect, 2000);
        };
        ws.onerror = () => hud.textContent = 'error';
      }
      connect();
    </script>
  </body>
</html>
