// FFA, ruleset 30 to match the client WASM (built --features ts30 only).
// Based on the shipped TS server.cfg; see Ernie's config guide section 2.
# hostname is deliberately absent: server.cfg wins over a +hostname command
# line, and the per-instance name belongs to the orchestrator, not to a file
# baked into the image. entrypoint.sh sets it from TS_HOSTNAME.
# hostname "bulletballet TS #0"
sv_aim 0
pausable 0
sv_maxspeed 330
// The bot roster. The registry overrides this at runtime
// (ts_bot_quota = TS_BOT_TARGET - humans), so this is the number the
// server boots with and the number the registry drives back to.
ts_bot_quota 16
log 1
respawntime 5
// roundtime is the TS ROUND timer, in seconds, and it is INERT in FFA
// deathmatch: the round modes are the ones that use it. In FFA the timer
// that ends the match — and therefore advances the map cycle — is
// mp_timelimit, in MINUTES. The stock TS 3.0 server.cfg ships
// "mp_timelimit 30" (half an hour on one map).
//
// Fifteen minutes. Three made a new map every 3:10 — nineteen times an
// hour — which is a scuffle rather than a match, and it re-oriented the
// player every couple of minutes. Ten was better but still short: a match
// should be long enough for a scoreboard worth reading, and long enough
// that a player who joins mid-map still has a map to play.
//
// It also churns the clients: every map change makes every client tear
// down and reconnect, and that reconnect is the exact moment the browser
// engine has been aborting with an OOM. A longer rotation cuts that
// exposure for free.
//
// The full 24-map cycle is now ~6 hours.
mp_timelimit 15
roundtime 180
weaponstay 30
ammocount 0
weaponrestriction 0
realbullet 0
mp_friendlyfire 0
spectacularness 50
lastmanstanding 0
mp_theonemode 0
mp_teamplay 0
mp_teamlist "team1;team2;team3;team4"
mp_teammodels "seal;merc|gordon;laurence|agent|hitman;castor"
sv_cheats 0
