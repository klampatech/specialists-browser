name: Deploy

# Ship what merged on main to production.
#
# WHAT THIS DEPLOYS
#   - the frontend bundle (always)
#   - the control-plane images: registry, orchestrator, bridge (when their
#     source changed)
#
# WHAT THIS DOES NOT DEPLOY
#   - the game server image. Its payload is the Rust port's compiled
#     server DLL, which is a build artifact and is deliberately not
#     committed. The game containers are also owned by the orchestrator,
#     because scaling the fleet is a decision, not a deployment.
#
# THE PR GATE
#   Branch protection is not available on this repository's plan (private
#   repo, free account — the API answers 403). So this workflow checks
#   the same thing branch protection would: that the commit came from a
#   merged pull request. A direct push to main does not reach production.

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  # The pull-request gate needs to READ pull requests. Without this, the
  # API answers with an error object rather than a list, and the gate
  # cannot tell "no pull requests" from "I was not allowed to look".
  pull-requests: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      # ── the PR gate ───────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          # The webxash submodule is a PRIVATE repository. The default
          # token works for public submodules; being explicit about it
          # is the difference between a checkout that works and one
          # that 404s on a private submodule.
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          # Depth 2 so that HEAD~1 exists — the change detection compares
          # against it. With the default depth of 1 there is no parent
          # commit, and the step fails with "ambiguous argument".
          fetch-depth: 2

      - name: Refuse a commit that did not come from a pull request
        # The SAME gate the PR-required workflow uses. The first copy of
        # this check in the deploy had `permissions: contents: read` and
        # no `pull-requests: read`, so the API answered with an error
        # object instead of a list — and `jq 'length'` on an object is
        # its KEY COUNT. The gate read "3 pull requests" and approved a
        # direct push to main. It now fails closed, and the permission
        # is declared.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: node tools/ci/pr-gate.cjs "$SHA"


      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<'EOF'
          Host prod
            HostName ${{ secrets.PROD_SSH_HOST }}
            User ${{ secrets.PROD_SSH_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          EOF
          ssh -F ~/.ssh/config prod 'echo "  ssh ok: $(whoami)@$(hostname)"'

      # ── what changed? ─────────────────────────────────────────────────
      - name: Work out what changed
        id: changed
        env:
          # The push event's `before` is the commit that was on main
          # before this push — the exact base of the comparison. HEAD~1
          # is the fallback, and it needs a checkout with enough depth.
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BEFORE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD~1)
          fi
          echo "  comparing against $base"
          git diff --name-only "$base" HEAD > /tmp/parent-changed.txt
          echo "  changed files:"
          sed 's/^/    /' /tmp/parent-changed.txt

          # The submodule's INTERIOR.
          #
          # A pointer move is ONE line in the parent's diff — "webxash" —
          # and it says nothing about what changed inside it. The old rule
          # matched '^webxash/' (with a slash) and so never matched a
          # pointer move: the frontend build was skipped, the deploy went
          # green, and the old bundle kept serving. That is how the
          # keyboard fix merged without ever reaching production.
          #
          # So when the pointer moves, diff the submodule itself and hand
          # its interior paths to the decision.
          : > /tmp/submodule-changed.txt
          submodule_diff_unknown=0
          if grep -qx 'webxash' /tmp/parent-changed.txt; then
            old=$(git rev-parse "$base:webxash" 2>/dev/null || echo "")
            new=$(git rev-parse "HEAD:webxash" 2>/dev/null || echo "")
            echo "  the webxash submodule moved: ${old:0:7} -> ${new:0:7}"
            if [ -n "$old" ] && [ -n "$new" ]; then
              # The submodule is a shallow clone, so the OLD commit may
              # not be in it. Fetch it before deciding we cannot see.
              if ! git -C webxash cat-file -e "$old^{commit}" 2>/dev/null; then
                git -C webxash fetch --depth=500 origin "$old" 2>/dev/null || true
              fi
              if git -C webxash cat-file -e "$old^{commit}" 2>/dev/null; then
                git -C webxash diff --name-only "$old" "$new" > /tmp/submodule-changed.txt \
                  || submodule_diff_unknown=1
              else
                submodule_diff_unknown=1
              fi
            else
              submodule_diff_unknown=1
            fi
            echo "  changed inside the submodule:"
            sed 's/^/    /' /tmp/submodule-changed.txt
            # `if`, not `&&`: under `set -e` a failing test at the end of a
            # step is the step's exit status, and the step would fail.
            if [ "$submodule_diff_unknown" = "1" ]; then
              echo "  (could not read the submodule's interior — rebuilding the images to be safe)"
            fi
          fi

          node tools/deploy/changed-paths.cjs \
            --parent /tmp/parent-changed.txt \
            --submodule /tmp/submodule-changed.txt \
            --unknown "$submodule_diff_unknown" | tee -a "$GITHUB_OUTPUT"
          echo "  decided: $(grep -E '^(frontend|services)=' "$GITHUB_OUTPUT" | tr '\n' ' ')"

      # ── the frontend ──────────────────────────────────────────────────
      - name: Set up bun
        # The frontend is a BUN project — bun.lock, not package-lock.json.
        # `npm ci` cannot even run here: there is no npm lockfile, and
        # two of the old dependencies were unpublished from npm, so a
        # fresh install failed with a 404.
        if: steps.changed.outputs.frontend == '1'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install and build the frontend
        if: steps.changed.outputs.frontend == '1'
        working-directory: webxash
        env:
          VITE_ASSET_BASE: https://assets.bulletballet.dev
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx vue-tsc --noEmit
          bun run build
          if [ -e dist/hl/tsmod.zip ] || [ -d dist/hl/ts ]; then
            echo "::error::the built bundle contains the TS game archive — it belongs on R2"
            exit 1
          fi
          echo "  built $(du -sh dist | cut -f1)"

      - name: Ship the frontend
        if: steps.changed.outputs.frontend == '1'
        run: |
          set -euo pipefail
          # Upload beside the live directory, then swap. A plain rsync
          # --delete in place leaves a window where index.html is new and
          # the hashed assets it references are old — which is a blank
          # page for exactly as long as the upload takes.
          # `hl/` is excluded on purpose: the game archive is served
          # from R2, not from the web bundle. The tracked zips in
          # public/hl are 168 MB of game content that has no business
          # being re-uploaded to the VPS on every deploy.
          #
          # PERMISSIONS. `/srv` is owned by root and the deploy user is
          # `ubuntu`, so the staging directory has to be created with
          # sudo and handed over before rsync can write into it.
          # Without that, rsync dies with
          #
          #     mkdir "/srv/web.new" failed: Permission denied (13)
          #
          # at the LAST step of the deploy — after the build, with the
          # old bundle still live and nothing shipped. `/srv` and `/home`
          # are the same filesystem, so the swap below is a rename and
          # not a copy.
          ssh -F ~/.ssh/config prod '
            set -euo pipefail
            sudo rm -rf /srv/web.new
            sudo mkdir -p /srv/web.new
            sudo chown $(id -un):$(id -gn) /srv/web.new
          '
          rsync -az --delete --exclude 'hl/' webxash/dist/ prod:/srv/web.new/
          ssh -F ~/.ssh/config prod '
            set -euo pipefail
            sudo rm -rf /srv/web.old
            sudo mv /srv/web /srv/web.old
            # Keep the previous release''s assets. Caddy sends no
            # Cache-Control for index.html, so a browser may serve a
            # CACHED index.html for a while after the swap — and that
            # cached page points at the OLD bundle name. If the old
            # bundle is gone, the page loads nothing at all: a blank
            # screen for whoever was mid-session. Carrying the old
            # assets forward costs one release worth of files and
            # `-n` means the new files win on any name collision.
            sudo cp -an /srv/web.old/assets/. /srv/web.new/assets/ \
              || echo "  warning: could not carry the previous assets forward"
            # If the new directory cannot go in, put the old one back.
            # A failed swap that leaves /srv/web missing is a DOWN site,
            # and a down site is worse than a stale bundle.
            if ! sudo mv /srv/web.new /srv/web; then
              echo "  the swap failed — restoring the previous bundle"
              sudo mv /srv/web.old /srv/web
              exit 1
            fi
            sudo chown -R $(id -un):$(id -gn) /srv/web
            sudo rm -rf /srv/web.old
            echo "  frontend swapped in"
          '

      - name: Verify the live frontend is the one we built
        # The check that was missing.
        #
        # The deploy was green for a merge that changed the frontend, and
        # production was still serving the previous bundle — because the
        # build step had been skipped and nothing ever compared what was
        # built against what is live. A green deploy and a live site are
        # different claims; this one compares them.
        if: steps.changed.outputs.frontend == '1'
        run: |
          set -euo pipefail
          # Compare the PAGE'S OWN reference, not a glob of the assets
          # directory. The build emits several files matching
          # index-*.js — lazily-loaded chunks alongside the main bundle —
          # and globbing picks whichever sorts first, which is not
          # necessarily the one the page loads. The question is "does
          # the page the player gets reference the bundle we built",
          # and the page's own script tag answers it.
          #
          # `sed` rather than `xargs basename`: with no match, xargs
          # runs basename with no operand and exits 123, which is a
          # failure with no explanation attached.
          built=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' webxash/dist/index.html \
                 | head -1 | sed 's|.*/||')
          # The cache-buster matters: the CDN and Caddy both cache
          # index.html, and a stale one would compare against the bundle
          # we just replaced.
          live=$(curl -fsS --max-time 20 "https://bulletballet.dev/?v=${{ github.sha }}" \
                 | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1 | sed 's|.*/||')
          echo "  built: ${built:-<none>}"
          echo "  live:  ${live:-<none>}"
          if [ -z "$built" ] || [ -z "$live" ]; then
            echo "::error::could not compare the live bundle with the one we built"
            exit 1
          fi
          if [ "$built" != "$live" ]; then
            echo "::error::the live bundle ($live) is not the bundle we built ($built)"
            exit 1
          fi
          echo "  the live frontend matches the build"

      # ── the control plane ─────────────────────────────────────────────
      - name: Build the service images
        if: steps.changed.outputs.services == '1'
        run: |
          set -euo pipefail
          docker build -f services/registry/Dockerfile.registry -t registry:${{ github.sha }} .
          docker build -f services/orchestrator/Dockerfile.orchestrator -t orchestrator:${{ github.sha }} .
          docker build -f tools/deploy/Dockerfile.bridge -t ts-bridge:${{ github.sha }} .

      - name: Ship the service images
        if: steps.changed.outputs.services == '1'
        run: |
          set -euo pipefail
          # Streamed over SSH rather than pushed to a registry: the
          # images contain our source, and a public package registry
          # would publish it. A private one would need a pull credential
          # on the host for no benefit at this size.
          for pair in \
            "registry:${{ github.sha }} registry" \
            "orchestrator:${{ github.sha }} orchestrator" \
            "ts-bridge:${{ github.sha }} ts-bridge"; do
            set -- $pair
            echo "  streaming $1"
            docker save "$1" | gzip -1 | ssh -F ~/.ssh/config prod 'gunzip | docker load'
          done

      - name: Recreate the control plane
        if: steps.changed.outputs.services == '1'
        run: |
          set -euo pipefail
          scp -F ~/.ssh/config tools/deploy/deploy-services.sh prod:/home/ubuntu/deploy-services.sh
          ssh -F ~/.ssh/config prod '
            set -euo pipefail
            chmod +x /home/ubuntu/deploy-services.sh
            REGISTRY_IMAGE=registry:'"${{ github.sha }}"' \
            ORCHESTRATOR_IMAGE=orchestrator:'"${{ github.sha }}"' \
            BRIDGE_IMAGE=ts-bridge:'"${{ github.sha }}"' \
            /home/ubuntu/deploy-services.sh
          '

      # ── did it work? ──────────────────────────────────────────────────
      - name: Verify production
        run: |
          set -euo pipefail
          echo "  waiting for the site to answer"
          for _ in $(seq 1 20); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 10 https://bulletballet.dev/ || echo 000)
            [ "$code" = "200" ] && break
            sleep 3
          done
          echo "  site: http=$code"
          [ "$code" = "200" ] || { echo "::error::the site did not come up"; exit 1; }

          echo "  the server browser:"
          # POLL, do not sample. This step runs immediately after the
          # control plane was recreated, and the registry needs a moment
          # to come up:
          #
          #   - its first A2S poll populates the server list (~1s)
          #   - its first metrics poll fills in the tickrate (~8s)
          #
          # Sampling once read `tickrate: null` off a perfectly healthy
          # server and failed the deploy. The server was fine; the check
          # was racing the control plane's startup.
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 https://bulletballet.dev/api/servers | tee /tmp/servers.json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          servers = data.get("servers") or []
          if not servers:
              sys.exit(1)
          for s in servers:
              if s.get("maxPlayers") != 32:
                  sys.exit(1)
              if not (s.get("tickrate") or 0) > 0:
                  sys.exit(1)
          '; then
              echo "  the fleet reports a healthy server (after $((attempt - 1)) extra attempt(s))"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::the registry never reported a healthy server"
              cat /tmp/servers.json || true
              exit 1
            fi
            echo "  not ready yet (attempt $attempt/30) — waiting"
            sleep 3
          done
          echo
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/servers.json'))
          for s in data.get('servers') or []:
              print(f"    {s.get('id')} {s.get('map')} {s.get('players')}/{s.get('maxPlayers')} "
                    f"tick={s.get('tickrate')} humans={s.get('humans')} bots={s.get('bots')}")
          PY

      - name: Internal endpoints
        # The registry and the orchestrator bind to loopback, so they are
        # only reachable from the host itself.
        run: |
          set -euo pipefail
          ssh -F ~/.ssh/config prod '
            set -euo pipefail
            printf "  registry:  "; curl -fsS --max-time 5 http://127.0.0.1:8081/api/registry | head -c 120; echo
            printf "  orchestr:  "; curl -fsS --max-time 5 http://127.0.0.1:8090/api/orchestrator | head -c 120; echo
            printf "  bridge:    "; curl -fsS --max-time 5 http://127.0.0.1:27017/health | head -c 120; echo
          '

  browser:
    name: Verify in a real browser
    # The point of a deploy is that the thing works. A green HTTP 200
    # from the landing page does not mean a player can get into a game —
    # that is exactly the failure the first real user hit.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The webxash submodule is a PRIVATE repository. The default
          # token works for public submodules; being explicit about it
          # is the difference between a checkout that works and one
          # that 404s on a private submodule.
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: The Play button reaches the server
        run: node tools/deploy/play-button-e2e.cjs https://bulletballet.dev/

      - name: Two browsers can be in the server at once
        run: node tools/deploy/two-player-e2e.cjs https://bulletballet.dev/ 2
