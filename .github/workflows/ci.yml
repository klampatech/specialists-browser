name: CI

# The gate every pull request has to pass.
#
# Kept deliberately cheap: typecheck, build, and the unit suite. The
# browser suite that talks to production is NOT here — it belongs to the
# deploy, after the merge, because a 493 MB download per PR is not a
# thing anyone should pay for on every review.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webxash
    steps:
      - uses: actions/checkout@v4
        with:
          # The webxash submodule is a PRIVATE repository. The default
          # token works for public submodules; being explicit about it
          # is the difference between a checkout that works and one
          # that 404s on a private submodule.
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Set up bun
        # The frontend is a BUN project — bun.lock, not package-lock.json.
        # There is no npm lockfile here, so `npm ci` cannot run at all.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        working-directory: webxash
        run: bun install --frozen-lockfile

      - name: Typecheck
        # The typecheck is the cheapest possible regression gate, and it
        # catches the class of bug where a store field is renamed and
        # one consumer is not.
        working-directory: webxash
        run: bunx vue-tsc --noEmit

      - name: Build
        working-directory: webxash
        env:
          VITE_ASSET_BASE: https://assets.bulletballet.dev
        run: |
          set -euo pipefail
          bun run build
          # public/hl/ legitimately holds three TRACKED zips (168 MB)
          # that are part of this repo. What must NOT be in the build is
          # the TS archive and its split parts — 494 MB each, gitignored,
          # and served from R2 instead. A build that picked those up
          # would publish them a second time, to the wrong place, for
          # free.
          if [ -e dist/hl/tsmod.zip ] || [ -d dist/hl/ts ]; then
            echo "::error::the built bundle contains the TS game archive — it belongs on R2"
            exit 1
          fi
          echo "  bundle size: $(du -sh dist | cut -f1)"


  unit:
    name: Unit — the regressions that actually bit us
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The webxash submodule is a PRIVATE repository. The default
          # token works for public submodules; being explicit about it
          # is the difference between a checkout that works and one
          # that 404s on a private submodule.
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check every service and deploy script
        # A service that fails to parse is a container that dies in the
        # first second, and a deploy that reports success anyway.
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r f; do
            if node --check "$f" >/dev/null 2>&1; then
              echo "  ok   $f"
            else
              echo "  FAIL $f"
              node --check "$f" 2>&1 | head -5 || true
              failed=1
            fi
          done < <(find services tools -name '*.mjs' -o -name '*.cjs' | grep -v node_modules | sort)
          exit $failed

      - name: Unit tests
        # Every one of these corresponds to a bug that reached production.
        run: node --test tests/unit/*.test.mjs

  docker:
    name: Docker — the images still build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The webxash submodule is a PRIVATE repository. The default
          # token works for public submodules; being explicit about it
          # is the difference between a checkout that works and one
          # that 404s on a private submodule.
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Build the service images
        # A Dockerfile that references a file the image does not copy is
        # a container that starts and dies in the same second. Building
        # the image is the only way to know.
        run: |
          docker build -f services/registry/Dockerfile.registry -t registry:ci .
          docker build -f services/orchestrator/Dockerfile.orchestrator -t orchestrator:ci .
          docker build -f tools/deploy/Dockerfile.bridge -t ts-bridge:ci .

      - name: The service images must not contain game assets
        # The server image is asset-free on purpose: the assets are a
        # runtime volume. A baked-in copy is a copyright problem and a
        # 1.1 GB image.
        run: |
          set -euo pipefail
          for img in registry:ci orchestrator:ci ts-bridge:ci; do
            size=$(docker image inspect "$img" --format '{{.Size}}')
            echo "  $img: $((size / 1000000)) MB"
            if docker run --rm --entrypoint sh "$img" -c \
              'ls /srv 2>/dev/null; find / -maxdepth 3 \( -name "*.bsp" -o -name "*.pak" -o -name "*.mdl" \) 2>/dev/null | head -5' \
              | grep -q .; then
              echo "::error::$img contains game assets — the images must stay asset-free"
              exit 1
            fi
          done
          echo "  all three images are asset-free"

  port:
    name: Port — the Rust client and server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rust
        # The port's own rust-toolchain.toml pins the version (1.95.0).
        # This action installs `stable` as the default, and rustup then
        # reads rust-toolchain.toml when cargo runs inside the port's
        # directory, so the PINNED version is what compiles the tests --
        # verified in the run log: "the missing active toolchain
        # 1.95.0-x86_64-unknown-linux-gnu has been auto-installed".
        # The cost is a second toolchain download (stable, then 1.95.0).
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the cargo registry and the build directory
        # The cold build is the whole cost of this job, so caching it is
        # the difference between ~40 seconds and several minutes.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/port/tsp-rs/target
          key: port-cargo-${{ hashFiles('tools/port/tsp-rs/Cargo.lock') }}
          restore-keys: port-cargo-

      - name: libclang
        # crates/goldsrc-sys's build script runs bindgen, which needs
        # libclang. Without it the port does not compile, and the error
        # says "Unable to find libclang" whether or not the files are
        # there. scripts/test.sh finds this copy under /usr/lib/llvm-*/lib.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libclang-dev

      - name: The engine headers
        # crates/goldsrc-sys's build script needs the xash3d-fwgs headers
        # and panics with "FWGS headers not found" without them. The
        # port's own build scripts clone the same tree to the same place.
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/FWGS/xash3d-fwgs.git /tmp/xash3d-fwgs

      - name: The port's tests
        # 1,624 tests across the client, the server, the two ruleset
        # versions and the shared layer. None of them ran in CI before
        # 2026-10-24: nothing in the pipeline compiled the port at all.
        #
        # The release profile, because that is the profile the port
        # ships in.
        working-directory: tools/port/tsp-rs
        run: scripts/test.sh --workspace --release
